# ============================================================================
# MySQL · 5.7 ~ 8.4（非默认，用 -Dspring-boot.run.profiles=mysql 启用）
# 账号要先建好并授予该库权限；库不存在时 createDatabaseIfNotExist=true 会尝试自动创建，
# 但这要求账号本身有建库权限，只给了单库权限的账号仍会 Access denied。
# 本地一步到位（用 root 执行）：
#   CREATE DATABASE orivone_upgrade_demo DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
#   CREATE USER 'orivone_upgrade_demo'@'%' IDENTIFIED BY 'orivone_upgrade_demo';
#   GRANT ALL PRIVILEGES ON orivone_upgrade_demo.* TO 'orivone_upgrade_demo'@'%';
# 下面是示例连接信息，换成自己的库时端口、账号、密码、库名一起改。
# ============================================================================
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/orivone_upgrade_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: orivone_upgrade_demo
    password: orivone_upgrade_demo
    driver-class-name: com.mysql.cj.jdbc.Driver

orivone:
  dbupgrade:
    # 也可以留空走 auto 探测，但显式写出来能省一次连接，也避免探测不到时的歧义
    db-type: mysql

demo:
  upgrade:
    script-dir: upgrade-scripts/mysql
